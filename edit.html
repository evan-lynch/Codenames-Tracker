<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Game — Codenames Tracker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">`n  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-brand"><span class="red">Code</span><span class="blue">names</span>&nbsp;Tracker</a>
    <div class="nav-links" id="nav-links"></div>
  </nav>

  <main class="container" style="max-width:640px">
    <a href="history.html" class="back-link">&#8592; Game History</a>
    <h1 class="page-title">Edit Game</h1>

    <div id="loading" class="loading">Loading...</div>

    <form id="game-form" style="display:none">
      <div id="error-msg" class="alert alert-error" style="display:none"></div>

      <div class="form-group">
        <label class="form-label">Winning Team</label>
        <div class="team-selector">
          <button type="button" class="team-option blue" data-team="blue">Blue Wins</button>
          <button type="button" class="team-option red" data-team="red">Red Wins</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Players</label>
        <div class="game-layout">
          <div class="team-column">
            <div class="team-column-header blue-header">Blue Team</div>
            <div class="role-section">
              <div class="role-section-label">Operatives</div>
              <div class="role-player-list" id="blue-op-list"></div>
              <button type="button" class="add-role-player" data-team="blue" data-role="operative">+ Add</button>
            </div>
            <div class="role-section">
              <div class="role-section-label">Spymaster</div>
              <div class="role-player-list" id="blue-sm-list"></div>
              <button type="button" class="add-role-player" data-team="blue" data-role="spymaster">+ Add</button>
            </div>
          </div>
          <div class="team-column">
            <div class="team-column-header red-header">Red Team</div>
            <div class="role-section">
              <div class="role-section-label">Operatives</div>
              <div class="role-player-list" id="red-op-list"></div>
              <button type="button" class="add-role-player" data-team="red" data-role="operative">+ Add</button>
            </div>
            <div class="role-section">
              <div class="role-section-label">Spymaster</div>
              <div class="role-player-list" id="red-sm-list"></div>
              <button type="button" class="add-role-player" data-team="red" data-role="spymaster">+ Add</button>
            </div>
          </div>
        </div>
        <p class="form-hint">Won/lost is set automatically by their team.</p>
      </div>

      <div class="form-group">
        <label class="form-label" for="notes">Notes (optional)</label>
        <textarea id="notes" class="form-textarea" placeholder="Anything worth remembering about this game..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%; padding:14px; font-size:1rem">Save Changes</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/edit.js"></script>
</body>
</html>
