<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codenames Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-brand"><span class="red">Code</span><span class="blue">names</span>&nbsp;Tracker</a>
    <div class="nav-links" id="nav-links"></div>
  </nav>

  <div class="home-page">

    <aside id="profile-sidebar" class="profile-sidebar">
      <div class="loading" style="padding:20px 0">Loading...</div>
    </aside>

    <div class="main-content">

      <section class="leaderboard-panel">
        <h1 class="page-title">Leaderboard</h1>
        <div class="card">
          <table class="table">
            <thead>
              <tr>
                <th>#</th>
                <th>Player</th>
                <th>Wins</th>
                <th>Losses</th>
                <th>Win Rate</th>
              </tr>
            </thead>
            <tbody id="leaderboard-body">
              <tr><td colspan="5" class="loading">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <div class="right-panels">

        <section class="history-panel">
          <h2 class="panel-title">Game History</h2>
          <div id="game-history-list">
            <div class="loading">Loading...</div>
          </div>
        </section>

        <section class="best-teams-panel">
          <h2 class="panel-title">Teams</h2>
          <div id="best-teams-list">
            <div class="loading">Loading...</div>
          </div>
        </section>

      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/leaderboard.js"></script>
</body>
</html>
