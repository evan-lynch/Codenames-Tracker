<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="box"><rect width="32" height="32" rx="6"/></clipPath>
  </defs>
  <!-- Dark base -->
  <rect width="32" height="32" rx="6" fill="#0e0d14"/>
  <!-- Red top-left triangle -->
  <polygon points="0,0 32,0 0,32" fill="#d63418" clip-path="url(#box)"/>
  <!-- Blue bottom-right triangle -->
  <polygon points="32,0 32,32 0,32" fill="#1a68cc" clip-path="url(#box)"/>
  <!-- Thin diagonal divider line -->
  <line x1="0" y1="32" x2="32" y2="0" stroke="#0e0d14" stroke-width="2.5" clip-path="url(#box)"/>
</svg>
