<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Game — Codenames Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-brand"><span>Codenames</span> Tracker</a>
    <div class="nav-links" id="nav-links"></div>
  </nav>

  <main class="container" style="max-width:640px">
    <a href="index.html" class="back-link">&#8592; Leaderboard</a>
    <h1 class="page-title">Log a Game</h1>

    <div id="loading" class="loading">Loading...</div>

    <form id="game-form" style="display:none" id="form-content">
      <div id="error-msg" class="alert alert-error" style="display:none"></div>

      <div class="form-group">
        <label class="form-label" for="played-at">Date Played</label>
        <input type="date" id="played-at" class="form-input" required>
      </div>

      <div class="form-group">
        <label class="form-label">Winning Team</label>
        <div class="team-selector">
          <button type="button" class="team-option red" data-team="red">Red Wins</button>
          <button type="button" class="team-option blue" data-team="blue">Blue Wins</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Players</label>
        <div class="players-section">
          <div id="player-rows"></div>
          <button type="button" class="add-player-btn" id="add-player">+ Add Player</button>
        </div>
        <p class="form-hint">Add everyone who played. Won/lost is determined automatically by their team.</p>
      </div>

      <div class="form-group">
        <label class="form-label" for="screenshot-url">Screenshot URL (optional)</label>
        <input type="url" id="screenshot-url" class="form-input" placeholder="https://imgur.com/...">
        <p class="form-hint">Upload your screenshot to Imgur, Discord, etc. and paste the link here.</p>
      </div>

      <div class="form-group">
        <label class="form-label" for="notes">Notes (optional)</label>
        <textarea id="notes" class="form-textarea" placeholder="Anything worth remembering about this game..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%; padding:12px">Log Game</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/log.js"></script>
  <script>
    // Set today's date as default
    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('played-at');
      if (input) input.valueAsDate = new Date();
    });
  </script>
</body>
</html>
