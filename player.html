<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player — Codenames Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-brand"><span class="red">Code</span><span class="blue">names</span>&nbsp;Tracker</a>
    <div class="nav-links" id="nav-links"></div>
  </nav>

  <main class="container">
    <a href="index.html" class="back-link">&#8592; Leaderboard</a>

    <h1 class="page-title" id="player-name">Loading...</h1>

    <div class="stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(160px, 200px))">
      <div class="stat-card">
        <div class="stat-value green" id="stat-wins">—</div>
        <div class="stat-label">Wins</div>
      </div>
    </div>

    <p class="section-heading">Game History</p>
    <div class="card">
      <div id="history-list">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
