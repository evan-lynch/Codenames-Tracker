<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player — Codenames Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-brand"><span>Codenames</span> Tracker</a>
    <div class="nav-links" id="nav-links"></div>
  </nav>

  <main class="container">
    <a href="index.html" class="back-link">&#8592; Leaderboard</a>

    <h1 class="page-title" id="player-name">Loading...</h1>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-games">—</div>
        <div class="stat-label">Games</div>
      </div>
      <div class="stat-card">
        <div class="stat-value win-rate-high" id="stat-wins">—</div>
        <div class="stat-label">Wins</div>
      </div>
      <div class="stat-card">
        <div class="stat-value win-rate-low" id="stat-losses">—</div>
        <div class="stat-label">Losses</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-rate">—</div>
        <div class="stat-label">Win Rate</div>
      </div>
    </div>

    <h2 style="font-size:1rem; font-weight:700; margin-bottom:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px;">Game History</h2>
    <div class="card">
      <div id="history-list">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
